# Configurazione del pannello Pages CMS (app.pagescms.org). Generata da tools/gen_pages.py.
media:
- name: images
  label: Immagini
  input: public/img
  output: /img
  rename: safe
  extensions:
  - webp
  - jpg
  - jpeg
  - png
  - gif
  - svg
- name: files
  label: File da scaricare
  input: public/files
  output: /files
  rename: safe
  extensions:
  - pdf
  - zip
  - epub
